server:
  port: 8083
  address: 0.0.0.0

spring:
  application:
    name: traelo-delivery
  output:
    ansi:
      enabled: ALWAYS
  serverHost: traelo-mysql
  serverPort: 3306
  dataBase: traelo_db
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${spring.serverHost}:${spring.serverPort}/${spring.dataBase}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: traelo_super
    password: traelo30316
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      connection-test-query: select 1;
  jpa:
    open-in-view: true
    generate-ddl: true
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: false

servlet:
  multipart:
    enabled: true
    max-file-size: 512MB
    max-request-size: 512MB

traelo:
  security:
    datauser:
      url: http://traelo-security:8082/api/auth/getDataUser/

logging:
  level:
    root: INFO
    '[com.traelo.delivery]': DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
