server:
  port: 8083
  address: 0.0.0.0

spring:
  application:
    name: traelo-delivery
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      connection-test-query: select 1;
  jpa:
    open-in-view: true
    generate-ddl: true
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 512MB
      max-request-size: 512MB

traelo:
  security:
    datauser:
      url: http://traelo-security.railway.internal:8082/api/auth/getDataUser/

logging:
  level:
    root: INFO
    '[com.traelo.delivery]': DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
